name: Demo on GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/configure-pages@v5
      - run: python -m pip install .
      - env:
          NRSW_UPLOAD_API: ${{ vars.NRSW_UPLOAD_API }}
        run: |
          if [ -n "$NRSW_UPLOAD_API" ]; then
            nrsw export-demo --output site --upload-api "$NRSW_UPLOAD_API"
          else
            nrsw export-demo --output site
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
