[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "nrsw-document-forgery"
version = "0.4.1"
description = "Document forgery detector for known layouts, trained with genuine examples and few labeled forgeries"
keywords = ["document forgery detection", "document authentication", "tampering detection", "computer vision"]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=2.1,<3"]

[project.optional-dependencies]
vision = ["torch>=2.8,<3", "torchvision>=0.23,<1", "diffusers>=0.35,<1", "transformers>=4.48,<6", "accelerate>=1,<2", "safetensors>=0.5,<1", "Pillow>=11,<13", "opencv-python-headless>=4.11,<6", "huggingface-hub>=0.30,<2"]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
nrsw = "nrsw.cli:main"

[project.urls]
Repository = "https://github.com/riverhor/nrsw"
Documentation = "https://github.com/riverhor/nrsw#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["vision: optional image encoder and registration tests"]

[tool.setuptools.package-data]
nrsw = ["web/*.html", "web/*.css", "web/*.js", "web/specimens/*.json", "web/specimens/*.png", "web/specimens/*.jpg", "web/specimens/*.jpeg"]
